<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Craft</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --muted: #656d76;
    --track: #eaeef2;
    --accent: #0969da;
    --accent-text: #ffffff;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
    --paused: #8c959f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8d96a0;
      --track: #21262d;
      --accent: #2f81f7;
      --accent-text: #ffffff;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --paused: #6e7681;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .dir { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; color: inherit; }
  input[type=url] {
    flex: 1 1 320px; min-width: 0;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  }
  select { padding: 9px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary {
    padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text);
    font-weight: 600; cursor: pointer;
  }
  .primary:disabled { opacity: .6; cursor: default; }
  .form-error { color: var(--bad); margin: 8px 0 0; min-height: 1.45em; }

  #list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; border: 1px dashed var(--border); border-radius: 10px; }

  .item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted); }
  .item[data-state=downloading] .badge, .item[data-state=starting] .badge, .item[data-state=joining] .badge { color: var(--accent); }
  .item[data-state=completed] .badge { color: var(--ok); }
  .item[data-state=failed] .badge { color: var(--bad); }
  .item[data-state=paused] .badge, .item[data-state=pausing] .badge { color: var(--warn); }

  .actions { display: flex; gap: 6px; }
  .actions button {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer;
  }
  .actions button:hover { background: var(--track); }
  .actions button[data-action=stop]:hover, .actions button[data-action=remove]:hover { color: var(--bad); }

  .bar { display: flex; gap: 2px; height: 10px; margin: 12px 0 8px; }
  .seg { flex: 1 1 0; background: var(--track); border-radius: 3px; overflow: hidden; min-width: 2px; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .4s linear; }
  .item[data-state=completed] .fill { background: var(--ok); }
  .item[data-state=paused] .fill, .item[data-state=pausing] .fill, .item[data-state=stopped] .fill { background: var(--paused); }
  .item[data-state=failed] .fill { background: var(--bad); }
  .bar.indeterminate .seg { position: relative; }
  .bar.indeterminate .fill {
    width: 30% !important; position: absolute; left: 0;
    animation: slide 1.2s ease-in-out infinite alternate;
  }
  @keyframes slide { to { left: 70%; } }

  .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
  .url { color: var(--muted); font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-width: 560px) {
    .top { flex-wrap: wrap; }
    .name { flex-basis: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Download Craft</h1>
    <span class="dir" id="dir"></span>
  </header>

  <form id="add">
    <input type="url" id="url" placeholder="Paste a download link" required autocomplete="off" aria-label="Download link">
    <select id="conns" aria-label="Connections">
      <option value="1">1 connection</option>
      <option value="2">2 connections</option>
      <option value="4">4 connections</option>
      <option value="8" selected>8 connections</option>
      <option value="16">16 connections</option>
      <option value="32">32 connections</option>
    </select>
    <button class="primary" type="submit" id="submit">Download</button>
  </form>
  <p class="form-error" id="form-error" role="alert"></p>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>No downloads yet. Paste a link above to start.</p>
</main>

<template id="item-template">
  <div class="item">
    <div class="top">
      <span class="name"></span>
      <span class="badge"></span>
      <span class="actions">
        <button type="button" data-action="pause">Pause</button>
        <button type="button" data-action="resume">Continue</button>
        <button type="button" data-action="stop" title="Cancel and delete the partial download">Stop</button>
        <button type="button" data-action="remove" title="Remove from the list (the downloaded file is kept)">Remove</button>
      </span>
    </div>
    <div class="bar"></div>
    <div class="meta"></div>
    <div class="error" hidden></div>
    <div class="url"></div>
  </div>
</template>

<script>
const ACTIONS = {
  starting: ["pause", "stop"],
  downloading: ["pause", "stop"],
  joining: [],
  pausing: [],
  stopping: [],
  paused: ["resume", "stop"],
  failed: ["resume", "remove"],
  completed: ["remove"],
  stopped: ["remove"],
};
const LABELS = {
  starting: "Connecting", downloading: "Downloading", joining: "Joining", pausing: "Pausing",
  paused: "Paused", stopping: "Stopping", stopped: "Stopped", completed: "Completed", failed: "Failed",
};

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const template = document.getElementById("item-template");
const items = new Map(); // id -> {el, refs, segs}
let connsInitialised = false;

function bytes(n) {
  if (n < 1024) return n + " B";
  const units = ["KiB", "MiB", "GiB", "TiB"];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return n.toFixed(1) + " " + units[i];
}

function duration(s) {
  s = Math.round(s);
  if (!isFinite(s) || s >= 360000) return "--:--";
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  const pad = (x) => String(x).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
}

function describe(d) {
  const known = d.size >= 0;
  const pct = known && d.size > 0 ? (100 * d.downloaded / d.size).toFixed(1) + "%" : "";
  const amount = known ? `${bytes(d.downloaded)} of ${bytes(d.size)}` : bytes(d.downloaded);
  const parts = d.parts ? d.parts.length : 0;
  switch (d.state) {
    case "starting": return "Connecting…";
    case "joining": return `Joining ${parts} parts…`;
    case "downloading": {
      const bits = [pct, amount, bytes(Math.round(d.speed || 0)) + "/s"];
      if (known && d.speed > 0) bits.push(duration((d.size - d.downloaded) / d.speed) + " left");
      bits.push(d.resumable ? `${parts} parts` : "1 connection (server doesn't support splitting)");
      return bits.filter(Boolean).join(" · ");
    }
    case "pausing": return "Pausing…";
    case "stopping": return "Stopping…";
    case "paused":
      return [pct, amount, d.resumable ? "" : "can't resume on this server, Continue starts over"].filter(Boolean).join(" · ");
    case "completed": return `${bytes(d.size)} · saved to ${d.path}`;
    case "stopped": return "Stopped, partial download deleted";
    case "failed": return d.downloaded > 0 ? [pct, amount].filter(Boolean).join(" · ") : "";
  }
  return "";
}

function createItem(d) {
  const el = template.content.firstElementChild.cloneNode(true);
  el.dataset.id = d.id;
  const q = (s) => el.querySelector(s);
  return {
    el, segs: [],
    refs: { name: q(".name"), badge: q(".badge"), bar: q(".bar"), meta: q(".meta"), error: q(".error"), url: q(".url") },
    buttons: [...el.querySelectorAll("[data-action]")],
  };
}

function updateBar(it, d) {
  let segs = d.parts && d.parts.length ? d.parts : [];
  if (!segs.length) segs = [{ length: d.size > 0 ? d.size : 1, done: d.size > 0 ? d.downloaded : (d.state === "completed" ? 1 : 0) }];
  if (it.segs.length !== segs.length) {
    it.refs.bar.replaceChildren();
    it.segs = segs.map(() => {
      const seg = document.createElement("div");
      seg.className = "seg";
      const fill = document.createElement("div");
      fill.className = "fill";
      seg.append(fill);
      it.refs.bar.append(seg);
      return { seg, fill };
    });
  }
  segs.forEach((p, i) => {
    const { seg, fill } = it.segs[i];
    seg.style.flexGrow = Math.max(p.length, 1);
    fill.style.width = (p.length > 0 ? Math.min(100, 100 * p.done / p.length) : 0) + "%";
  });
  const active = d.state === "downloading" || d.state === "starting";
  it.refs.bar.classList.toggle("indeterminate", active && d.size < 0);
}

function updateItem(it, d) {
  const { el, refs } = it;
  el.dataset.state = d.state;
  refs.name.textContent = d.name;
  refs.name.title = d.path || d.name;
  refs.badge.textContent = LABELS[d.state] || d.state;
  refs.meta.textContent = describe(d);
  refs.error.hidden = !d.error;
  refs.error.textContent = d.error || "";
  refs.url.textContent = d.url;
  refs.url.title = d.url;
  const allowed = ACTIONS[d.state] || [];
  for (const b of it.buttons) b.hidden = !allowed.includes(b.dataset.action);
  updateBar(it, d);
}

function render(data) {
  document.getElementById("dir").textContent = "Saving to " + data.dir;
  if (!connsInitialised) {
    connsInitialised = true;
    const sel = document.getElementById("conns");
    if (![...sel.options].some((o) => o.value === String(data.connections))) {
      sel.add(new Option(`${data.connections} connections`, data.connections));
    }
    sel.value = String(data.connections);
  }
  const seen = new Set();
  data.downloads.forEach((d, i) => {
    let it = items.get(d.id);
    if (!it) { it = createItem(d); items.set(d.id, it); }
    if (listEl.children[i] !== it.el) listEl.insertBefore(it.el, listEl.children[i] || null);
    updateItem(it, d);
    seen.add(d.id);
  });
  for (const [id, it] of items) {
    if (!seen.has(id)) { it.el.remove(); items.delete(id); }
  }
  emptyEl.hidden = data.downloads.length > 0;
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

let refreshTimer;
async function refresh() {
  clearTimeout(refreshTimer);
  try {
    render(await api("GET", "/api/downloads"));
  } catch (e) {
    document.getElementById("dir").textContent = "Lost connection to Download Craft — is it still running?";
  }
  refreshTimer = setTimeout(refresh, 700);
}

document.getElementById("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("url");
  const submit = document.getElementById("submit");
  const errorEl = document.getElementById("form-error");
  errorEl.textContent = "";
  submit.disabled = true;
  try {
    await api("POST", "/api/downloads", {
      url: input.value.trim(),
      connections: Number(document.getElementById("conns").value),
    });
    input.value = "";
    refresh();
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    submit.disabled = false;
    input.focus();
  }
});

listEl.addEventListener("click", async (e) => {
  const button = e.target.closest("button[data-action]");
  if (!button) return;
  const id = button.closest(".item").dataset.id;
  const action = button.dataset.action;
  button.disabled = true;
  try {
    if (action === "remove") await api("DELETE", `/api/downloads/${id}`);
    else await api("POST", `/api/downloads/${id}/${action}`);
  } catch (err) {
    document.getElementById("form-error").textContent = err.message;
  } finally {
    button.disabled = false;
    refresh();
  }
});

refresh();
</script>
</body>
</html>
